name: Bug report
description: Report a reproducible problem in the Mera Inference Gateway
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Do **not** report security
        vulnerabilities here — see [SECURITY.md](../SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can a maintainer reproduce this?
      placeholder: |
        1. Send request to ...
        2. With headers / body ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: service-version
    attributes:
      label: Service version
      description: The version from package.json or the deployed image tag.
    validations:
      required: true
  - type: input
    id: affected-endpoint
    attributes:
      label: Affected endpoint / route
      placeholder: e.g. POST /api/chat, POST /api/batch-infer, GET /health
    validations:
      required: true
  - type: dropdown
    id: deployment-context
    attributes:
      label: Deployment context
      options:
        - Local (npm run start:dev)
        - Cloud Run
        - Other
    validations:
      required: true
  - type: input
    id: node-env
    attributes:
      label: NODE_ENV
      placeholder: e.g. development, production
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste structured log lines or error output. Redact any secrets, tokens, or personal data.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help. Redact any personal data.
