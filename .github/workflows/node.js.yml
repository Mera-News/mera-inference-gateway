name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    # The e2e suite boots the full AppModule, which opens Redis (BullMQ) and
    # MongoDB (Mongoose) connections at startup. Provide both as throwaway
    # service containers on their default localhost ports.
    # Images are pulled from Google's public Docker Hub mirror (mirror.gcr.io)
    # rather than Docker Hub directly: hosted runners frequently hit Docker Hub
    # anonymous rate limits / reachability timeouts ("context deadline exceeded")
    # during "Initialize containers". mirror.gcr.io is a no-auth pull-through
    # cache with no anonymous pull limits (and we already deploy on GCP).
    services:
      redis:
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mirror.gcr.io/library/mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Seed .env from committed example so NestJS ConfigService and tests have
    # the required env vars at startup. No real secrets are touched here —
    # all values are placeholder strings from .env.example.
    - name: Seed .env for CI
      run: cp .env.example .env

    - name: Run lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Run unit tests with coverage
      run: npm run test:cov

    # The e2e suite spins up its own in-process JWKS server and tests
    # health + auth rejection, booting the full AppModule against the redis
    # and mongo service containers declared above.
    - name: Run e2e tests
      run: npm run test:e2e

    - name: Build
      run: npm run build
